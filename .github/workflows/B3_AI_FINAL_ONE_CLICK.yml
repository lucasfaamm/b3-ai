name: B3 AI FINAL

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * 1-5"
    - cron: "0 15 * * 0"
    - cron: "0 13 1 * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: b3-ai-final
  cancel-in-progress: false

env:
  BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
  CVM_PROXY_BASE: ${{ secrets.CVM_PROXY_BASE }}

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install final frozen system
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import base64, pathlib
          files={'historical_evidence.py': '', 'forward_validate_fixed_model.py': '', 'generate_final_signals.py': '', 'streamlit_app.py': '', 'MODEL_FREEZE.json': ''}
          for name,data in files.items():
           p=pathlib.Path(name); p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(base64.b64decode(data)); print("wrote",name)

          PY

      - name: One-time full setup
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          python refresh_fundamentals.py
          python refresh_ranking.py
          if [ ! -f data/cvm_pit_fundamentals.csv.gz ]; then python build_cvm_pit.py; fi
          if [ ! -f results/fundamental_pit_backtest_panel.csv.gz ]; then python fundamental_backtest_calibrate.py; fi
          python historical_evidence.py
          python generate_final_signals.py
          python forward_validate_fixed_model.py
          python generate_final_signals.py

      - name: Daily final update
        if: github.event_name == 'schedule' && github.event.schedule == '15 22 * * 1-5'
        run: |
          python refresh_ranking.py
          python generate_final_signals.py

      - name: Weekly fundamentals update
        if: github.event_name == 'schedule' && github.event.schedule == '0 15 * * 0'
        run: |
          python refresh_fundamentals.py
          python refresh_ranking.py
          python generate_final_signals.py

      - name: Monthly forward validation
        if: github.event_name == 'schedule' && github.event.schedule == '0 13 1 * *'
        run: |
          python refresh_ranking.py
          python generate_final_signals.py
          python forward_validate_fixed_model.py
          python generate_final_signals.py

      - name: Commit updates
        run: |
          git config user.name "b3-ai-bot"
          git config user.email "b3-ai-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "B3 AI final automated update"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Disable old workflows after setup
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all --json id,name --limit 100 | jq -r '.[] | select(.name != "B3 AI FINAL") | .id' | while read -r id; do
            [ -z "$id" ] || gh workflow disable "$id" || true
          done
