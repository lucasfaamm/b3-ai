name: GLOBAL AI COMPLETE FIXED

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * 1-5"
    - cron: "0 15 * * 0"
    - cron: "0 13 1 * *"
    - cron: "0 14 15 1,4,7,10 *"

permissions:
  contents: write
  actions: write

concurrency:
  group: global-ai-complete
  cancel-in-progress: false

env:
  BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
  CVM_PROXY_BASE: ${{ secrets.CVM_PROXY_BASE }}

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance requests pandas numpy streamlit

      - name: Install complete Brasil + EUA system
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import base64,pathlib
          files={'us_complete_engine.py': '', 'us_pit_backtest.py': '', 'us_forward_validate.py': '', 'global_merge.py': '', 'streamlit_app.py': '', 'GLOBAL_COMPLETE_CONFIG.json': ''}
          for n,d in files.items():
           p=pathlib.Path(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(d));print('wrote',n)

          PY

      - name: First full build
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          echo "=== BRASIL ==="
          python refresh_fundamentals.py
          python refresh_ranking.py
          python generate_final_signals.py

          echo "=== EUA CURRENT + SEC PIT CACHE ==="
          python us_complete_engine.py --mode weekly

          echo "=== EUA HISTORICAL POINT-IN-TIME EVIDENCE ==="
          python us_pit_backtest.py

          echo "=== GLOBAL ==="
          python global_merge.py

          echo "=== INITIAL FORWARD LOGS ==="
          python forward_validate_fixed_model.py || true
          python us_forward_validate.py
          python generate_final_signals.py
          python us_complete_engine.py --mode daily
          python global_merge.py

      - name: Daily Brasil + EUA
        if: github.event_name == 'schedule' && github.event.schedule == '15 22 * * 1-5'
        run: |
          python refresh_ranking.py
          python generate_final_signals.py
          python us_complete_engine.py --mode daily
          python global_merge.py

      - name: Weekly fundamentals Brasil + EUA
        if: github.event_name == 'schedule' && github.event.schedule == '0 15 * * 0'
        run: |
          python refresh_fundamentals.py
          python refresh_ranking.py
          python generate_final_signals.py
          python us_complete_engine.py --mode weekly
          python global_merge.py

      - name: Monthly forward validation
        if: github.event_name == 'schedule' && github.event.schedule == '0 13 1 * *'
        run: |
          python refresh_ranking.py
          python generate_final_signals.py
          python us_complete_engine.py --mode daily
          python forward_validate_fixed_model.py || true
          python us_forward_validate.py
          python generate_final_signals.py
          python us_complete_engine.py --mode daily
          python global_merge.py

      - name: Quarterly CVM refresh
        if: github.event_name == 'schedule' && github.event.schedule == '0 14 15 1,4,7,10 *'
        run: |
          python build_cvm_pit.py || true

      - name: Commit all
        run: |
          git config user.name "global-ai-bot"
          git config user.email "global-ai-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Global AI complete automated update"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Disable every old workflow after successful setup
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all --json id,name --limit 100 |           jq -r '.[] | select(.name != "GLOBAL AI COMPLETE FIXED") | .id' |           while read -r id; do
            [ -z "$id" ] || gh workflow disable "$id" || true
          done
