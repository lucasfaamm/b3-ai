name: Weekly fundamentals refresh

on:
  schedule:
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Refresh fundamentals
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python refresh_fundamentals.py

      - name: Refresh ranking
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python refresh_ranking.py

      - name: Save results
        run: |
          git config user.name "b3-ai-bot"
          git config user.email "b3-ai-bot@users.noreply.github.com"
          git add data results || true
          git diff --cached --quiet || git commit -m "Update fundamentals"
          git push
