name: NUBANK GLOBAL RADAR

on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "0 15 * * 0"
    - cron: "0 13 1 * *"
    - cron: "0 14 15 1,4,7,10 *"

permissions:
  contents: write
  actions: write

concurrency:
  group: nubank-global-radar
  cancel-in-progress: false

env:
  BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
  CVM_PROXY_BASE: ${{ secrets.CVM_PROXY_BASE }}

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance requests pandas numpy streamlit

      - name: Install the complete Nubank radar
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import base64,pathlib
          files={'nubank_opportunity_radar.py': '', 'streamlit_app.py': '', 'NUBANK_RADAR_CONFIG.json': ''}
          for n,d in files.items():
           p=pathlib.Path(n);p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(base64.b64decode(d));print('wrote',n)

          PY

      - name: First complete build
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e
          python refresh_fundamentals.py
          python refresh_ranking.py
          python generate_final_signals.py
          python nubank_opportunity_radar.py

      - name: Daily update
        if: github.event_name == 'schedule' && github.event.schedule == '30 22 * * 1-5'
        run: |
          python refresh_ranking.py
          python generate_final_signals.py
          python nubank_opportunity_radar.py

      - name: Weekly fundamental refresh
        if: github.event_name == 'schedule' && github.event.schedule == '0 15 * * 0'
        run: |
          python refresh_fundamentals.py
          python refresh_ranking.py
          python generate_final_signals.py
          python nubank_opportunity_radar.py

      - name: Monthly validation refresh
        if: github.event_name == 'schedule' && github.event.schedule == '0 13 1 * *'
        run: |
          python forward_validate_fixed_model.py || true
          python refresh_ranking.py
          python generate_final_signals.py
          python nubank_opportunity_radar.py

      - name: Quarterly official CVM cache
        if: github.event_name == 'schedule' && github.event.schedule == '0 14 15 1,4,7,10 *'
        run: |
          python build_cvm_pit.py || true
          python nubank_opportunity_radar.py

      - name: Commit everything
        run: |
          git config user.name "nubank-radar-bot"
          git config user.email "nubank-radar-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Nubank Global Opportunity Radar update"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Disable old workflows after successful first build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow list --all --json id,name --limit 100 |           jq -r '.[] | select(.name != "NUBANK GLOBAL RADAR") | .id' |           while read -r id; do
            [ -z "$id" ] || gh workflow disable "$id" || true
          done
