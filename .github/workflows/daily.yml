name: Daily B3 ranking

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Refresh ranking
        env:
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
        run: python refresh_ranking.py

      - name: Save ranking
        run: |
          git config user.name "b3-ai-bot"
          git config user.email "b3-ai-bot@users.noreply.github.com"
          git add results || true
          git diff --cached --quiet || git commit -m "Update daily ranking"
          git push
